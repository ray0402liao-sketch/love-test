<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>她的默契測驗</title>

<style>

body{
font-family:Arial;
text-align:center;
background:linear-gradient(135deg,#89CFF0,#ffffff);
}

.card{
background:white;
padding:25px;
margin:25px auto;
width:85%;
border-radius:20px;
box-shadow:0 8px 20px rgba(0,0,0,0.15);
}

button{
display:block;
width:80%;
margin:10px auto;
padding:12px;
border:none;
border-radius:12px;
background:#4da6ff;
color:white;
font-size:16px;
}

#score{
font-size:22px;
margin-top:20px;
}

.heart{
font-size:40px;
animation:pop 0.6s infinite alternate;
}

@keyframes pop{
from{transform:scale(1);}
to{transform:scale(1.3);}
}

</style>
</head>

<body>

<h1>💙 你有多了解她</h1>

<div id="quiz"></div>

<div id="score"></div>

<script>

const questions=[

{
q:"她最喜歡的飲料是？",
options:["珍珠奶茶","蜂蜜檸檬","檸檬多多","紅茶"],
answer:2
},

{
q:"她希望身高到幾公分？",
options:["158","160","163","165"],
answer:2
},

{
q:"她說巧克力代表？",
options:["友誼","純愛","告白","幸運"],
answer:1
},

{
q:"你們曾經聊到幾天紀念？",
options:["30","50","60","100"],
answer:1
},

{
q:"她夢到你們做什麼？",
options:["打球","去約會吃東西","旅行","看電影"],
answer:1
}

]

let score=0

function start(){

let html=""

questions.forEach((q,i)=>{

html+=`
<div class="card">
<h3>${i+1}. ${q.q}</h3>
`

q.options.forEach((o,j)=>{

html+=`<button onclick="answer(${i},${j})">${o}</button>`

})

html+=`<div id="r${i}"></div></div>`

})

document.getElementById("quiz").innerHTML=html

}

function answer(i,c){

let q=questions[i]

if(c==q.answer){

score++

document.getElementById("r"+i).innerHTML="❤️ 正確"

}else{

document.getElementById("r"+i).innerHTML="❌ 正確："+q.options[q.answer]

}

if(i==questions.length-1){

showScore()

}

}

function showScore(){

let text=""

if(score==5){

text=`<div class="heart">❤️❤️❤️</div>滿分！你超了解她`

}else if(score>=3){

text=`默契 ${score}/5 還不錯`

}else{

text=`默契 ${score}/5 要更了解她喔`

}

document.getElementById("score").innerHTML=text

}

start()

</script>

</body>
</html>
